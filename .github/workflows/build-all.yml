name: Build iOS, Android, and Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all:
    name: Build All Platforms
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. BUILD WEB-MOBILE (From pre-generated folder)
      # ==========================================
      - name: Build Web-Mobile
        run: |
          if [ -d "build/web-mobile" ]; then
            cd build/web-mobile
            zip -r ../../Cocos-Web-Build.zip *
          else
            echo "build/web-mobile folder not found in repository. Skipping."
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Build
          path: Cocos-Web-Build.zip

      # ==========================================
      # 2. BUILD IOS (UNPATCHED)
      # ==========================================
      - name: Compile iOS App (Unpatched)
        run: |
          if [ -d "build/jsb-link/frameworks/runtime-src/proj.ios_mac" ]; then
            cd build/jsb-link/frameworks/runtime-src/proj.ios_mac
            
            XCODE_PROJ=$(ls | grep .xcodeproj)
            SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
            
            xcodebuild clean build \
              -project "$XCODE_PROJ" \
              -scheme "$SCHEME_NAME" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Xcode project not found in repository. Skipping."
          fi

      - name: Upload Unpatched iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Unpatched-Buggy
          path: build/jsb-link/frameworks/runtime-src/proj.ios_mac/build/Release-iphoneos/*.app

      # ==========================================
      # 3. BUILD IOS (PATCHED)
      # ==========================================
      - name: Apply Native iOS Network Fix
        run: |
          if [ -f "patch_ios.sh" ] && [ -d "build/jsb-link/frameworks/runtime-src/proj.ios_mac" ]; then
            chmod +x patch_ios.sh
            ./patch_ios.sh
          fi

      - name: Compile iOS App (Patched)
        run: |
          if [ -d "build/jsb-link/frameworks/runtime-src/proj.ios_mac" ]; then
            cd build/jsb-link/frameworks/runtime-src/proj.ios_mac
            
            XCODE_PROJ=$(ls | grep .xcodeproj)
            SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
            
            # Rebuild the project now that it has been patched
            xcodebuild clean build \
              -project "$XCODE_PROJ" \
              -scheme "$SCHEME_NAME" \
              -destination "generic/platform=iOS" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Upload Patched iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Patched-Fixed
          path: build/jsb-link/frameworks/runtime-src/proj.ios_mac/build/Release-iphoneos/*.app

      # ==========================================
      # 4. BUILD ANDROID
      # ==========================================
      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Compile Android APK (Gradle)
        run: |
          if [ -d "build/jsb-link/frameworks/runtime-src/proj.android-studio" ]; then
            cd build/jsb-link/frameworks/runtime-src/proj.android-studio
            
            # Explicitly tell Gradle where the Android SDK is
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
            
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android Studio project not found in repository. Skipping."
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/jsb-link/frameworks/runtime-src/proj.android-studio/app/build/outputs/apk/debug/*.apk
